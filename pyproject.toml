[project]
name = "wednesday-edge"
version = "0.1.0"
description = "Live, timestamped forecasts of weekly US crude inventory changes, scored publicly against EIA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "tabulate>=0.10.0",
    "typer>=0.12",
    "tzdata>=2026.5",
    "xlrd>=2.0",
]

[project.scripts]
wedge = "wedge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wedge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
